[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "blue-whale-desktop-pet"
version = "4.3.1"
description = "A tiny Windows whale companion with walking, rice feeding and SCI greetings"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PySide6==6.11.2", "Pillow==12.3.0"]
classifiers = ["Operating System :: Microsoft :: Windows", "Programming Language :: Python :: 3"]

[project.optional-dependencies]
dev = ["PyInstaller==6.22.3"]

[project.gui-scripts]
blue-whale-pet = "blue_whale_pet.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
blue_whale_pet = ["assets/*.png"]
