name: Windows checks and build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Check
        run: python -m unittest discover -s tests -v
      - name: Build Windows EXE
        run: python -m PyInstaller --noconfirm --clean blue_whale_pet.spec
      - uses: actions/upload-artifact@v7
        with:
          name: BlueWhalePet-Windows
          path: dist/BlueWhalePet.exe
          if-no-files-found: error
          retention-days: 14
